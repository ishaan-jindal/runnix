name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0). Uses the tag to build and publish."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  # Verify, vet, and test the tagged code before building any release
  # binaries.
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build
        run: go build ./...

  binaries:
    runs-on: ubuntu-latest
    needs: gate

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build gateway and dispatcher
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -ldflags "-s -w" -o dist/runnix-gateway-linux-${{ matrix.arch }} ./cmd/gateway
          CGO_ENABLED=0 go build -ldflags "-s -w" -o dist/runnix-dispatcher-linux-${{ matrix.arch }} ./cmd/dispatcher

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: dist/runnix-*-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: binaries

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag must look like vX.Y.Z (got $TAG)"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum runnix-* > runnix-checksums.txt
          ls -la
          cat runnix-checksums.txt

      # The `## [X.Y.Z]` section (tag minus the leading `v`) becomes the
      # release notes, with the `##` header line stripped. Falls back to
      # `Release <tag>` when the entry is missing.
      - name: Extract changelog entry
        run: |
          VER="${{ steps.tag.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          python3 -c "
          import re, sys
          ver, tag = sys.argv[1], sys.argv[2]
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
              pattern = rf'(##\s*\[{re.escape(ver)}\].*?)(?=\n##\s*\[|\n\[[^\]]+\]:|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  section = match.group(1).strip()
                  lines = section.split('\n')
                  if lines[0].startswith('## '):
                      section = '\n'.join(lines[1:]).strip()
                  with open('release_notes.md', 'w') as out:
                      out.write(section)
              else:
                  with open('release_notes.md', 'w') as out:
                      out.write('Release ' + tag)
          except Exception:
              with open('release_notes.md', 'w') as out:
                  out.write('Release ' + tag)
          " "$VER" "$TAG"

      - name: Create or update release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          if ! gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            dist/*; then
            echo "Release $TAG may already exist; uploading assets to it..."
            gh release upload "$TAG" dist/* --clobber
          fi

          gh release view "$TAG" --json tagName,assets --jq '.tagName + " has " + (.assets | length | tostring) + " assets"'
