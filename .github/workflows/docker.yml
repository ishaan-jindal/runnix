name: docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: ghcr.io/ishaan-jindal/runnix-gateway
            context: .
            dockerfile: ./Dockerfile.gateway
            platforms: linux/amd64,linux/arm64
          - image: ghcr.io/ishaan-jindal/runnix-dispatcher
            context: .
            dockerfile: ./Dockerfile.dispatcher
            platforms: linux/amd64,linux/arm64
          - image: ghcr.io/ishaan-jindal/runnix-runner-python
            context: ./runner/docker
            dockerfile: ./runner/docker/Dockerfile
            # The sandbox image executes on the x86_64 host under runsc,
            # so it is built for amd64 only.
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No QEMU: Go services cross-compile from $BUILDPLATFORM (see
      # Dockerfile.*) and the runner image is amd64-only.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # NOTE: :edge/:latest publish without waiting for ci. A cross-workflow
          # gate needs a workflow_run restructure, so require ci on main via
          # branch protection instead.
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
