name: ci
on:
  # A same-repo PR emits push and pull_request for one commit, and the two
  # refs differ so concurrency cannot collapse them. Push stays on main.
  # pull_request is unfiltered so stacked PRs (any base) still run checks.
  # v* tags are not branch pushes; release.yml gates those.
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      min_coverage: "35.2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v2
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}% (min_coverage: ${min_coverage}%)"
          awk -v t="$total" -v m="$min_coverage" 'BEGIN { exit !(t >= m) }'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - run: go build ./...
      - run: just deploy-check
      - name: Check generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc diff
