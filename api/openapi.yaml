openapi: 3.0.3
info:
  title: Runnix
  version: 0.1.0
  description: >
    Runnix API. All executions and tenants routes require
    Authorization: Bearer <jwt> AND X-Tenant-ID. 401 = bad token,
    400 = missing tenant, 403 = not a member.
servers:
  - url: http://localhost:4000
paths:
  /healthz:
    get:
      summary: Liveness
      responses: { '200': { description: ok } }
  /readyz:
    get:
      summary: Readiness (live Postgres + NATS checks)
      responses:
        '200': { description: ready }
        '503': { description: a dependency is unavailable }
  /languages:
    get:
      summary: Supported languages
      responses: { '200': { description: ok } }
  /auth/register:
    post:
      summary: "Register"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 3 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: created; personal tenant auto-provisioned, token pair issued
  /auth/login:
    post:
      summary: "Login"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: ok, token pair issued }
  /auth/refresh:
    post:
      summary: "Refresh"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: ok, rotated token pair issued }
        '400': { description: missing refreshToken or invalid JSON body }
        '401': { description: unknown, revoked, or expired refresh token }
  /auth/logout:
    post:
      summary: "Logout (revoke one refresh token; idempotent, always 200 even with empty or malformed body)"
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: logged out }
  /auth/logout-all:
    post:
      summary: "Logout all sessions (revoke every refresh token)"
      security:
        - bearerAuth: []
      responses:
        '200': { description: logged out }
        '401': { description: bad token }
  /users/me:
    get:
      summary: "Current user with tenant memberships"
      security:
        - bearerAuth: []
      responses:
        '200': { description: ok }
        '401': { description: bad token }
  /tenants:
    post:
      summary: Create org tenant (caller becomes owner)
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 3, maxLength: 60 }
                slug: { type: string, pattern: '^[a-z0-9-]{3,40}$', description: optional; derived from name when absent }
      responses:
        '201': { description: tenant created }
        '400': { description: invalid name/slug }
        '403': { description: authentication required (no user identity) }
  /tenants/{id}:
    get:
      summary: Get tenant (id must equal X-Tenant-ID)
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: ok }
        '403': { description: id does not match X-Tenant-ID or not a member }
        '404': { description: tenant not found }
  /tenants/{id}/api-keys:
    post:
      summary: Create tenant-scoped API key (full key returned once)
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60, description: leading/trailing whitespace is trimmed }
      responses:
        '201': { description: created }
        '400': { description: invalid name }
        '403': { description: id does not match X-Tenant-ID or not a member }
    get:
      summary: List API keys for tenant (no secrets; revoked keys are included with revoked_at)
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: ok }
        '403': { description: id does not match X-Tenant-ID or not a member }
  /tenants/{id}/api-keys/{keyId}:
    delete:
      summary: Revoke API key (idempotent)
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: keyId
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{32}$' }
      responses:
        '200': { description: revoked }
        '403': { description: id does not match X-Tenant-ID or not a member }
        '404': { description: API key not found (unknown id or owned by another tenant) }
  /executions:
    post:
      summary: Submit execution (persisted queued, published to JetStream)
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, language, source]
              properties:
                tenant_id: { type: string, format: uuid, description: must equal X-Tenant-ID }
                language: { type: string, enum: [python] }
                source: { type: string, maxLength: 102400 }
                stdin: { type: string, maxLength: 102400 }
                timeout_s: { type: integer, minimum: 1, maximum: 60, default: 2 }
                webhook_url: { type: string, format: uri, description: 'http(s) on public hosts only (SSRF-guarded at submit and delivery); signed completion delivery, see docs/webhooks.md' }
      responses:
        '202': { description: 'queued; body {id, status, created_at}' }
        '400': { description: invalid input }
        '403': { description: tenant_id does not match X-Tenant-ID }
        '429':
          description: 'tenant submit quota exceeded (hourly or active limit); honor the Retry-After response header (seconds)'
          headers:
            Retry-After:
              description: seconds to wait before retrying
              schema: { type: integer, minimum: 1 }
        '502': { description: submit queue unavailable; execution marked failed }
        '503': { description: webhook_url set but webhooks are disabled (no signing secret) }
    get:
      summary: List executions for tenant (newest first)
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: 'ok; body {executions, limit, offset}' }
  /executions/{id}:
    get:
      summary: Get execution (always tenant-scoped; 404 when owned by another tenant)
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 'ok; full execution incl. source, stdout, stderr, exit_code' }
        '400': { description: invalid id }
        '404': { description: execution not found }
components:
  parameters:
    TenantID:
      name: X-Tenant-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
security:
  - bearerAuth: []
