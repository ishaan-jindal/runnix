openapi: 3.0.3
info:
  title: Runnix
  version: 0.0.1-scaffold
  description: >
    Runnix API. All executions and tenants routes require
    Authorization: Bearer <jwt> AND X-Tenant-ID. 401 = bad token,
    400 = missing tenant, 403 = not a member.
servers:
  - url: http://localhost:4000
paths:
  /healthz:
    get:
      summary: Liveness
      responses: { '200': { description: ok } }
  /readyz:
    get:
      summary: Readiness
      responses: { '200': { description: ready } }
  /languages:
    get:
      summary: Supported languages
      responses: { '200': { description: ok } }
  /auth/register:
    post:
      summary: "Register (deferred: auth-plus-postgres)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 3 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: created; personal tenant auto-provisioned, token pair issued
        '501': { description: scaffold }
  /auth/login:
    post:
      summary: "Login (deferred: auth-plus-postgres)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: ok, token pair issued }
        '501': { description: scaffold }
  /auth/refresh:
    post:
      summary: "Refresh (deferred: auth-plus-postgres)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: ok, rotated token pair issued }
        '501': { description: scaffold }
  /tenants:
    post:
      summary: Create tenant
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses: { '501': { description: scaffold } }
  /tenants/{id}:
    get:
      summary: Get tenant
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses: { '501': { description: scaffold } }
  /executions:
    post:
      summary: Submit execution
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, language, source]
              properties:
                tenant_id: { type: string, format: uuid }
                language: { type: string, enum: [python] }
                source: { type: string }
                stdin: { type: string }
                timeout_s: { type: integer, default: 2 }
                webhook_url: { type: string, format: uri }
      responses: { '202': { description: queued }, '501': { description: scaffold } }
    get:
      summary: List executions for tenant
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses: { '501': { description: scaffold } }
  /executions/{id}:
    get:
      summary: Get execution
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses: { '501': { description: scaffold } }
components:
  parameters:
    TenantID:
      name: X-Tenant-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
security:
  - bearerAuth: []
