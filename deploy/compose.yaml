services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: runnix
      POSTGRES_PASSWORD: runnix
      POSTGRES_DB: runnix
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runnix"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2
    command: ["-js"]
    ports: ["4222:4222", "8222:8222"]

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile.gateway
    environment:
      PORT: "4000"
      ENV: development
      DATABASE_URL: postgres://runnix:runnix@postgres:5432/runnix?sslmode=disable
      NATS_URL: nats://nats:4222
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }

  dispatcher:
    build:
      context: ..
      dockerfile: Dockerfile.dispatcher
    environment:
      ENV: development
      DATABASE_URL: postgres://runnix:runnix@postgres:5432/runnix?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }

volumes:
  pgdata:
