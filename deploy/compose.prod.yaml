# Hosted prod stack (project: runnix-prod).
# Prereq (once per host): docker network create runnix-public
# Up: docker compose -p runnix-prod --env-file prod.env -f compose.prod.yaml up -d

services:
  postgres:
    image: postgres:16
    command: postgres -c shared_buffers=64MB -c max_connections=30
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runnix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-runnix}
    volumes: [prod_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  nats:
    image: nats:2
    command: ["-js", "-sd", "/data/jetstream"]
    volumes: [prod_natsdata:/data]
    mem_limit: 64m
    restart: unless-stopped

  gateway:
    image: ghcr.io/ishaan-jindal/runnix-gateway:${IMAGE_TAG:-latest}
    container_name: prod-gateway
    environment:
      PORT: "4000"
      ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-runnix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-runnix}?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
    networks: [default, runnix-public]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
    mem_limit: 96m
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m" } }

  dispatcher:
    image: ghcr.io/ishaan-jindal/runnix-dispatcher:${IMAGE_TAG:-latest}
    container_name: prod-dispatcher
    environment:
      ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-runnix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-runnix}?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      EXEC_WORKERS: "1"
      RUNNER_IMAGE: ghcr.io/ishaan-jindal/runnix-runner-python:${IMAGE_TAG:-latest}
      RUNNER_RUNTIME: runsc
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      REAP_INTERVAL: 1m
      REAP_STALE_AFTER: 5m
    # Matches the current dev posture (host docker socket) until Job-per-execution lands.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
    mem_limit: 256m
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m" } }

volumes:
  prod_pgdata:
  prod_natsdata:

networks:
  runnix-public:
    external: true
